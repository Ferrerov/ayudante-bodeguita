version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ayudante-bodeguita-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ayudante_bodeguita
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
